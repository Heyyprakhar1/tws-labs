title: Terraform in Action
level: intermediate
minutes: 15
summary: Audit and repair an incomplete project - fix providers, parameterize resources, and secure state.
steps:
  - id: welcome-to-project
    type: lesson
    title: Welcome to the platform team
    body: |
      You inherited an infrastructure workspace in `~/infra`. A previous engineer left several production blockers:

      - `providers.tf` has region syntax errors and missing requirements.
      - `main.tf` has hardcoded values that break multi-environment runs.
      - Downstream pipelines are blocked because `outputs.tf` is missing.
      - `backend.tf` lacks concurrency locking, and state files are tracked by git.

      In this practice lab, audit, repair, and harden this project.

      *Note: Sandbox checks verify HCL files on disk; no real cloud resources are provisioned.*

  - id: repair-providers
    type: task
    title: Fix the provider configuration
    body: |
      Open `infra/providers.tf`. Notice that the region is mistyped as `"us-east1"` (invalid AWS region syntax) and is missing provider requirements.

      1. Correct the region to `"us-east-1"`.
      2. Add a `terraform` block requiring provider `hashicorp/aws`.
    hint: 'Set region = "us-east-1" and add required_providers with source = "hashicorp/aws".'
    success: Provider repaired. The AWS provider now specifies a valid region and source constraint.

  - id: parameterize-resources
    type: task
    title: Decouple hardcoded environment values
    body: |
      In `infra/main.tf`, the bucket resource tag has hardcoded `Environment = "dev"`. (Note: S3 bucket names must be globally unique across AWS; here we use illustrative name `example-service-storage-dev`).

      1. In `infra/variables.tf`, declare `variable "environment"` with `type = string` and `default = "dev"`.
      2. In `infra/main.tf`, replace the hardcoded `"dev"` in the `Environment` tag with `var.environment`.
    hint: "Declare variable environment in variables.tf and reference var.environment in main.tf."
    success: Resource parameterized. The module can now deploy cleanly across multiple environments.

  - id: export-outputs
    type: task
    title: Export outputs for CI/CD
    body: |
      The automated deployment pipeline needs the S3 bucket's ID and ARN.

      Create `infra/outputs.tf` and export two values from `aws_s3_bucket.app`:
      1. `output "bucket_id"` with `value = aws_s3_bucket.app.id`
      2. `output "bucket_arn"` with `value = aws_s3_bucket.app.arn`
    hint: 'In infra/outputs.tf, declare output "bucket_id" and output "bucket_arn" pointing to aws_s3_bucket.app.'
    success: Outputs exported. Downstream automation can now read resource IDs and ARNs programmatically.

  - id: secure-state-and-backend
    type: task
    title: Configure locking and git hygiene
    body: |
      1. In `infra/backend.tf`, add `use_lockfile = true` inside `backend "s3"` to enable native state locking (supported in Terraform 1.10+).
      2. Create a `.gitignore` file in your project root to exclude Terraform state and sensitive variable files from version control:
      ```
      *.tfstate
      *.tfstate.*
      *.tfvars
      ```
    hint: "Add use_lockfile = true to backend s3 and add the state patterns to .gitignore."
    success: Workspace secured. State has concurrency protection and sensitive files are ignored by git.

  - id: wrap-up
    type: lesson
    title: Infrastructure ready for production!
    body: |
      **Outstanding work!** In this practice lab, you:

      - Diagnosed and repaired provider configuration bugs.
      - Refactored hardcoded values into dynamic input variables.
      - Connected module attributes to clean outputs for downstream tools.
      - Configured native S3 state locking and protected state files with git hygiene.

      These are the exact skills platform and DevOps engineers use every day to build reliable, production-grade cloud infrastructure with Terraform.
