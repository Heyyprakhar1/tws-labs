# Hosted / Production Docker Compose deployment with TLS reverse proxy
# Reference deployment for hosting TWS Labs behind an Nginx reverse proxy.
#
# Usage:
#   docker compose -f deploy/docker-compose.hosted.yml up -d
#
services:
  app:
    image: tws-labs:hosted
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LAB_PROFILE: hosted
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      LAB_ACCESS_TOKENS: ${LAB_ACCESS_TOKENS:-}
      PUBLIC_CHALLENGES: ${PUBLIC_CHALLENGES:-0}
      LAB_GATED: ${LAB_GATED:-1}
      TRUST_PROXY: "1"
      PORT: "8080"
      HOST: "0.0.0.0"
      MAX_SESSIONS: ${MAX_SESSIONS:-5}
      MAX_SESSIONS_PER_IP: ${MAX_SESSIONS_PER_IP:-3}
      LAB_IDLE_MIN: ${LAB_IDLE_MIN:-5}
      LAB_HARD_CAP_MIN: ${LAB_HARD_CAP_MIN:-15}
    # Internal port only - never directly exposed to public network
    expose:
      - "8080"
    cpus: 1.5
    mem_limit: 1024m
    pids_limit: 512
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /sandbox:size=256m,mode=0755,exec
    networks:
      - tws-internal

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
      - "${HOST_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - tws-internal

networks:
  tws-internal:
    driver: bridge
